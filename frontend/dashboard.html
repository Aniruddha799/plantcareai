<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PlantCare AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamic Navbar Container -->
    <div id="navbar-container"></div>

    <div class="container my-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-8">
                <h2 class="fw-bold">Welcome back, <span id="farmer-name" class="text-green-accent">Farmer</span>!</h2>
                <p class="text-muted">Here is the current health status of your crops.</p>
            </div>
            <div class="col-md-4 text-md-end">
                <a href="upload.html" class="btn btn-primary-custom px-4 py-2 me-2">📸 Scan Leaf</a>
                <a href="plants.html" class="btn btn-secondary-custom px-4 py-2">🌱 Add Plant</a>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-3 col-sm-6">
                <div class="glass-card p-4 text-center border-green-glow">
                    <div class="stat-icon-wrapper bg-green-dim mb-3 mx-auto">
                        <span class="fs-3">🌱</span>
                    </div>
                    <h6 class="stat-card-title mb-2">Total Plants</h6>
                    <h2 class="fw-bold mb-0 text-green-accent text-glow-green" id="stat-total-plants">-</h2>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="glass-card p-4 text-center border-info-glow">
                    <div class="stat-icon-wrapper bg-info-dim mb-3 mx-auto">
                        <span class="fs-3">📷</span>
                    </div>
                    <h6 class="stat-card-title mb-2">Total Scans</h6>
                    <h2 class="fw-bold mb-0 text-info text-glow-info" id="stat-total-scans">-</h2>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="glass-card p-4 text-center border-danger-glow">
                    <div class="stat-icon-wrapper bg-danger-dim mb-3 mx-auto">
                        <span class="fs-3">🦠</span>
                    </div>
                    <h6 class="stat-card-title mb-2">Diseases Spotted</h6>
                    <h2 class="fw-bold mb-0 text-danger text-glow-danger" id="stat-diseases-spotted">-</h2>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="glass-card p-4 text-center border-success-glow">
                    <div class="stat-icon-wrapper bg-success-dim mb-3 mx-auto">
                        <span class="fs-3">📈</span>
                    </div>
                    <h6 class="stat-card-title mb-2">Improving Plants</h6>
                    <h2 class="fw-bold mb-0 text-success text-glow-success" id="stat-improving-plants">-</h2>
                </div>
            </div>
        </div>

        <!-- Recent Scans Table -->
        <div class="row">
            <div class="col-12">
                <div class="glass-card p-4">
                    <h4 class="fw-bold mb-4">Recent Scans (Last 5 scans)</h4>
                    <div id="table-alert-container"></div>
                    <div class="table-responsive">
                        <table class="table table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Plant ID</th>
                                    <th>Diagnosis</th>
                                    <th>Severity</th>
                                    <th>Confidence</th>
                                    <th>Trend</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="recent-scans-body">
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-4">Loading reports...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core App Logic -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!isAuthenticated()) return;

            try {
                // Decode farmer name from JWT token payload
                const token = getToken();
                if (token) {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    document.getElementById("farmer-name").innerText = payload.sub.split('@')[0];
                }

                // FIX: Fetch plants and reports in parallel with Promise.all (was sequential before)
                // Reports now include trend field via joinedload fix in backend — no extra API calls needed.
                const [plants, reports] = await Promise.all([
                    apiFetch("/plants"),
                    apiFetch("/reports")
                ]);

                // Populate stats
                document.getElementById("stat-total-plants").innerText = plants.length;
                document.getElementById("stat-total-scans").innerText = reports.length;

                const diseases = reports.filter(r => r.disease !== "Healthy");
                document.getElementById("stat-diseases-spotted").innerText = diseases.length;

                // FIX: Count improving plants from the trend field already in reports.
                // Previously this made N extra API calls (/plants/{id}/recovery per plant).
                // Now we use the trend data embedded in each report response (fixed by joinedload in backend).
                // We find the latest report per plant and check if its trend is "Improving".
                const latestReportPerPlant = {};
                for (const report of reports) {
                    if (!latestReportPerPlant[report.plant_id]) {
                        // Reports are sorted newest-first, so first hit = latest scan for each plant
                        latestReportPerPlant[report.plant_id] = report;
                    }
                }
                const improvingPlants = Object.values(latestReportPerPlant)
                    .filter(r => r.trend === "Improving").length;
                document.getElementById("stat-improving-plants").innerText = improvingPlants;

                // Populate recent scans (last 5)
                const tbody = document.getElementById("recent-scans-body");
                tbody.innerHTML = "";

                const recentReports = reports.slice(0, 5);
                if (recentReports.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No scans found. Upload your first crop photo to get started!</td></tr>`;
                    return;
                }

                for (const r of recentReports) {
                    // FIX: Use trend directly from report object (joinedload fix in backend ensures this is populated).
                    // Previously made 1 extra API call per report row — completely eliminated.
                    const trendLabel = r.trend || "Baseline";
                    const trendClass = `badge-trend-${trendLabel.toLowerCase()}`;

                    const date = new Date(r.created_at).toLocaleDateString();
                    const confidencePercent = Math.round(r.confidence * 100) + "%";
                    const severityClass = r.severity && r.severity !== "None"
                        ? `badge-severity-${r.severity.toLowerCase()}`
                        : "badge-severity-none";
                    const severityLabel = r.severity === "None" ? "—" : r.severity;

                    tbody.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td><span class="fw-semibold text-green-accent">${r.plant_id}</span></td>
                            <td>${r.disease}</td>
                            <td><span class="${severityClass}">${severityLabel}</span></td>
                            <td>${confidencePercent}</td>
                            <td><span class="${trendClass}">${trendLabel}</span></td>
                            <td>
                                <a href="result.html?report_id=${r.id}" class="btn btn-sm btn-secondary-custom py-1 px-3">View Result</a>
                            </td>
                        </tr>
                    `;
                }

            } catch (err) {
                showAlert(err.message, "danger", "table-alert-container");
            }
        });
    </script>
</body>
</html>
