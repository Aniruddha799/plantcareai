<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PlantCare AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-green-accent pulse-element">🌱 PlantCare AI</h1>
                    <p class="text-muted">Plant Disease Detection & Recovery Tracking System</p>
                </div>
                
                <div class="glass-card p-4 p-md-5">
                    <h3 class="fw-bold mb-4 text-center">Farmer Login</h3>
                    
                    <div id="alert-container"></div>
                    
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control form-control-custom" id="email" required placeholder="name@domain.com">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-custom" id="password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-3">Log In</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <span class="text-muted">New farmer?</span> <a href="register.html" class="text-green-accent text-decoration-none fw-semibold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth & Fetch Scripts -->
    <script src="js/app.js"></script>
    <script>
        // Redirect if already logged in
        checkRedirectAuth();

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await apiFetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ email, password })
                });

                saveToken(response.access_token);
                window.location.href = "dashboard.html";
            } catch (err) {
                showAlert(err.message, "danger");
            }
        });
    </script>
</body>
</html>
