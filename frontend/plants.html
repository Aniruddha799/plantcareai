<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plants - PlantCare AI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Dynamic Navbar Container -->
    <div id="navbar-container"></div>

    <div class="container my-5">
        <div class="row g-4">
            <!-- Add Plant Form -->
            <div class="col-lg-4">
                <div class="glass-card p-4">
                    <h4 class="fw-bold mb-4">Register New Plant</h4>
                    <div id="form-alert-container"></div>
                    
                    <form id="add-plant-form">
                        <div class="mb-3">
                            <label for="crop_name" class="form-label">Crop Type</label>
                            <select class="form-select form-control-custom" id="crop_name" required>
                                <option value="" disabled selected>Select crop...</option>
                                <option value="Tomato">Tomato</option>
                                <option value="Potato">Potato</option>
                                <option value="Pepper">Pepper / Chilli</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="plant_name" class="form-label">Plant Nickname / Label</label>
                            <input type="text" class="form-control form-control-custom" id="plant_name" required placeholder="e.g. Tomato Plot A, Plant #5">
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-3">Add Crop Profile</button>
                    </form>
                </div>
            </div>

            <!-- List Plants -->
            <div class="col-lg-8">
                <div class="glass-card p-4">
                    <h4 class="fw-bold mb-4">My Crop Profiles</h4>
                    <div id="list-alert-container"></div>
                    
                    <div class="table-responsive">
                        <table class="table table-custom mb-0">
                            <thead>
                                <tr>
                                    <th>Plant ID</th>
                                    <th>Crop Name</th>
                                    <th>Nickname</th>
                                    <th>Added On</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="plants-list-body">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-4">Loading crops list...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core App Logic -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!isAuthenticated()) return;
            await loadPlants();

            document.getElementById("add-plant-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const crop_name = document.getElementById("crop_name").value;
                const plant_name = document.getElementById("plant_name").value;

                try {
                    const response = await apiFetch("/plants", {
                        method: "POST",
                        body: JSON.stringify({ crop_name, plant_name })
                    });
                    
                    showAlert("Plant profile created successfully!", "success", "form-alert-container");
                    document.getElementById("add-plant-form").reset();
                    await loadPlants();
                } catch (err) {
                    showAlert(err.message, "danger", "form-alert-container");
                }
            });
        });

        async function loadPlants() {
            const tbody = document.getElementById("plants-list-body");
            try {
                const plants = await apiFetch("/plants");
                tbody.innerHTML = "";

                if (plants.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No crops registered yet. Add your first plant using the form on the left!</td></tr>`;
                    return;
                }

                plants.forEach(p => {
                    const date = new Date(p.created_at).toLocaleDateString();
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="fw-semibold text-green-accent">${p.plant_id}</span></td>
                            <td>${p.crop_name}</td>
                            <td>${p.plant_name}</td>
                            <td>${date}</td>
                            <td>
                                <a href="upload.html?plant_id=${p.plant_id}" class="btn btn-sm btn-primary-custom py-1 px-3 me-2">📸 Scan</a>
                                <a href="recovery.html?plant_id=${p.plant_id}" class="btn btn-sm btn-secondary-custom py-1 px-3 me-2">📈 Graph</a>
                                <button onclick="deletePlant('${p.plant_id}')" class="btn btn-sm btn-outline-danger py-1 px-3">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                showAlert(err.message, "danger", "list-alert-container");
            }
        }

        async function deletePlant(plantId) {
            if (!confirm(`Are you sure you want to delete crop profile ${plantId}? Historical scan results will be kept in database.`)) return;
            
            try {
                await apiFetch(`/plants/${plantId}`, {
                    method: "DELETE"
                });
                await loadPlants();
                showAlert(`Crop profile ${plantId} successfully deleted.`, "success", "list-alert-container");
            } catch (err) {
                showAlert(err.message, "danger", "list-alert-container");
            }
        }
    </script>
</body>
</html>
